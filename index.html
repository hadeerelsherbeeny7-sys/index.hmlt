<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#113a4b">
        <link rel="icon" href="icon-192.png">
        <link rel="apple-touch-icon" href="icon-192.png">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Microcell: بيولوجيا الخلية</title>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #f2f6f8;
                --ink: #10303c;
                --muted: #6b8089;
                --card: #fff;
                --line: #d9e3e8;
                --head: #113a4b;
                --headink: #fff;
                --accent: #b0246b;
                --off: #a2b0b6;
                --ok: #1d8a5b;
                --bad: #c0392b;
                color-scheme: light;
            }

            :root[data-theme="dark"] {
                --bg: #0c1a21;
                --ink: #e6eff2;
                --muted: #8fa5ad;
                --card: #13262f;
                --line: #22404c;
                --head: #0a2733;
                --off: #4b606a;
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: Cairo, system-ui, sans-serif;
            }

            header {
                background: var(--head);
                color: var(--headink);
                padding: 24px 20px 18px;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .header-text {
                flex: 1;
            }

            h1 {
                margin: 0 0 6px;
                font-size: 1.5rem;
                line-height: 1.3;
            }

            .sub {
                margin: 0;
                color: #b9cdd5;
                font-size: .88rem;
            }

            .icon {
                background: rgba(255,255,255,.18);
                border: 0;
                border-radius: 10px;
                padding: 8px 14px;
                font-size: 1.2rem;
                cursor: pointer;
            }

            main {
                padding: 20px;
                max-width: 680px;
                margin: auto;
            }

            h2 {
                font-size: 1.15rem;
                margin: 0 0 16px;
            }

            .card {
                display: flex;
                align-items: center;
                gap: 16px;
                width: 100%;
                text-align: right;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 16px;
                margin-bottom: 12px;
                color: var(--ink);
                font: inherit;
                cursor: pointer;
                transition: transform 0.15s ease;
            }

            .card:not([disabled]):active {
                transform: scale(0.98);
            }

            .card[disabled] {
                opacity: .6;
                cursor: default;
            }

            .num {
                flex: none;
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: var(--accent);
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 700;
                font-size: 1.25rem;
            }

            .card[disabled] .num {
                background: var(--off);
            }

            .t {
                font-weight: 700;
                font-size: 1.15rem;
            }

            .m {
                color: var(--muted);
                font-size: .9rem;
                margin-top: 2px;
            }

            .back {
                background: none;
                border: 0;
                color: var(--accent);
                font: inherit;
                font-weight: 700;
                cursor: pointer;
                padding: 0 0 14px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .sec {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 14px 16px;
                margin-bottom: 12px;
            }

            /* تنسيق الجداول العلمية */
            .table-wrap {
                overflow-x: auto;
                margin-top: 12px;
                border-radius: 10px;
                border: 1px solid var(--line);
            }

            .custom-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.88rem;
                text-align: right;
            }

            .custom-table th, .custom-table td {
                padding: 10px 12px;
                border-bottom: 1px solid var(--line);
                border-left: 1px solid var(--line);
            }

            .custom-table th:last-child, .custom-table td:last-child {
                border-left: 0;
            }

            .custom-table th {
                background: var(--head);
                color: var(--headink);
                font-weight: 700;
                white-space: nowrap;
            }

            .custom-table tr:nth-child(even) {
                background: rgba(0, 0, 0, 0.02);
            }

            :root[data-theme="dark"] .custom-table tr:nth-child(even) {
                background: rgba(255, 255, 255, 0.03);
            }

            .opt {
                display: block;
                width: 100%;
                text-align: right;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 12px 14px;
                margin-top: 8px;
                color: var(--ink);
                font: inherit;
                cursor: pointer;
            }

            .opt.ok {
                border-color: var(--ok);
                background: rgba(29,138,91,.15);
                font-weight: 700;
            }

            .opt.bad {
                border-color: var(--bad);
                background: rgba(192,57,43,.15);
            }

            .tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 16px;
            }

            .tab {
                flex: 1;
                padding: 10px;
                border-radius: 10px;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--ink);
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }

            .tab.on {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }

            .score-card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 14px;
                margin-bottom: 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: 700;
            }

            .reset-btn {
                background: var(--accent);
                color: #fff;
                border: 0;
                border-radius: 8px;
                padding: 6px 14px;
                font: inherit;
                font-size: 0.85rem;
                cursor: pointer;
            }

            summary {
                font-weight: 700;
                cursor: pointer;
            }

            details ul {
                margin: 10px 0 0;
                padding-inline-start: 20px;
                line-height: 1.9;
            }
        </style>
    </head>
    <body>

                <h1>Microcell: بيولوجيا الخلية</h1>
                <p class="sub">كلية الزراعة · جامعة كفر الشيخ · د. عمرو عمران</p>
            </div>
            <button class="icon" id="theme" aria-label="تغيير الوضع">🌓</button>
        </header>
        <main id="app"></main>

                        { t: "إنتاج البروتين", p: ["في أوليات النواة (البكتيريا): النسخ والترجمة داخل السيتوبلازم مباشرة.", "لا يوجد فصل بينهما، فقد تبدأ الترجمة بينما mRNA ما زال يُنسخ.", "لا توجد معالجة أولية لـ mRNA، وتحدث الترجمة على ريبوسومات حرة.", "في حقيقيات النواة: يبدأ النسخ في النواة فيتكون Pre-mRNA ثم يُعالج فيصبح mRNA ناضجًا.", "يخرج mRNA و tRNA من النواة إلى السيتوبلازم عبر المسام النووية.", "الترجمة: تحويل mRNA إلى سلسلة أحماض أمينية بمساعدة tRNA والريبوسوم."] },
                        { t: "الشبكة الإندوبلازمية", p: ["عضية غشائية من أنابيب وأكياس، غشاؤها متصل بالغلاف النووي.", "الخشنة: عليها ريبوسومات فتبدو خشنة، وتسهم في تصنيع البروتينات.", "الملساء: بلا ريبوسومات، فيها إنزيمات تصنع الدهون وتزيل سمية بعض المركبات.", "تخليق الدهون: الفوسفوليبيد والكوليسترول.", "بالتعاون مع الميتوكوندريا تخلّق الهرمونات الاسترويدية من الكوليسترول.", "الكبد غني بالشبكة الملساء لإزالة السموم."] },
                        { t: "جهاز جولجي", p: ["عضية في حقيقيات النواة، مركز معالجة وتعديل وتغليف البروتينات والليبيدات القادمة من الشبكة الإندوبلازمية.", "سُمي نسبة إلى مكتشفه كاميلو جولجي.", "عدده من جهاز واحد إلى مئات في الخلية الواحدة.", "يتكون من أكياس مسطحة مكدسة تسمى الصهاريج.", "الوجه cis: يستقبل البروتينات من الشبكة الإندوبلازمية.", "الوجه trans: يرسل البروتينات المعدلة إلى وجهتها.", "وظيفته: تعديل البروتينات (إضافة سكريات)، وفرزها وتعبئتها في حويصلات توجّه إلى الغشاء الخلوي أو الليسوسومات."] },

            const app = document.getElementById('app');
            const root = document.documentElement;

            document.getElementById('theme').onclick = () => {
                const currentTheme = root.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', newTheme);
            };

            function home() {
                app.innerHTML = '<h2>اختر المحاضرة</h2>';
                LECTURES.forEach(l => {
                    const b = document.createElement('button');
                    b.className = 'card';
                    b.disabled = !l.sections;
                    b.innerHTML = `
                        <span class="num">${l.id}</span>
                        <span>
                            <div class="t">${l.title}</div>
                            <div class="m">${l.sections ? `${l.sections.length} قسم · ${l.questions.length} سؤال` : 'قريبًا'}</div>
                        </span>
                    `;
                    if (l.sections) {
                        b.onclick = () => lecture(l, 'sec');
                    }
                    app.appendChild(b);
                });
            }

            function lecture(l, tab) {
                app.innerHTML = `
                    <button class="back" id="backBtn">← رجوع للمحاضرات</button>
                    <h2>${l.title}</h2>
                    <div class="tabs">
                        <button class="tab ${tab === 'sec' ? 'on' : ''}" id="tabSec">الأقسام والشرح</button>
                        <button class="tab ${tab === 'quiz' ? 'on' : ''}" id="tabQuiz">اختبار المحاضرة (${l.questions.length} سؤال)</button>
                    </div>
                    <div id="body"></div>
                `;

                document.getElementById('backBtn').onclick = home;
                document.getElementById('tabSec').onclick = () => lecture(l, 'sec');
                document.getElementById('tabQuiz').onclick = () => lecture(l, 'quiz');

                const body = document.getElementById('body');
                if (tab === 'sec') {
                    l.sections.forEach((s, i) => {
                        const d = document.createElement('details');
                        d.className = 'sec';
                        
                        let contentHtml = '';
                        if (s.p && s.p.length > 0) {
                            contentHtml += `<ul>${s.p.map(x => `<li>${x}</li>`).join('')}</ul>`;
                        }

                        if (s.table) {
                            let rowsHtml = s.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
                            contentHtml += `
                                <div class="table-wrap">
                                    <table class="custom-table">
                                        <thead><tr>${s.table.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                                        <tbody>${rowsHtml}</tbody>
                                    </table>
                                </div>
                            `;
                        }

                        d.innerHTML = `<summary>${i + 1}. ${s.t}</summary>${contentHtml}`;
                        if (i === 0) d.open = true;
                        body.appendChild(d);
                    });
                } else {
                    renderQuiz(l, body);
                }
            }

            function renderQuiz(l, container) {
                // عزل الاختبار داخل قالب مستقل ومغلق
                container.innerHTML = `
                    <div class="score-card">
                        <span id="scoreText">النتيجة الحالية: 0 / ${l.questions.length} (0%)</span>
                        <button class="reset-btn" id="retryBtn">إعادة الاختبار</button>
                    </div>
                    <div id="quiz-list"></div>
                `;

                const list = document.getElementById('quiz-list');
                let score = 0;

                // زر إعادة الاختبار يستدعي نفس الدالة ويمسح الحاوية بالكامل
                document.getElementById('retryBtn').onclick = () => {
                    renderQuiz(l, container);
                };

                l.questions.forEach((q, idx) => {
                    const box = document.createElement('div');
                    box.className = 'sec';
                    box.innerHTML = `<div class="t" style="font-size:1rem; margin-bottom:8px;">${idx + 1}. ${q.q}</div>`;

                    q.o.forEach((txt, i) => {
                        const b = document.createElement('button');
                        b.className = 'opt';
                        b.textContent = txt;
                        b.onclick = () => {
                            if (box.dataset.done) return;
                            box.dataset.done = 'true';

                            const btns = box.querySelectorAll('.opt');
                            btns[q.a].classList.add('ok');

                            if (i === q.a) {
                                score++;
                            } else {
                                b.classList.add('bad');
                            }

                            const percentage = Math.round((score / l.questions.length) * 100);
                            document.getElementById('scoreText').textContent = `النتيجة الحالية: ${score} / ${l.questions.length} (${percentage}%)`;
                        };
                        box.appendChild(b);
                    });
                    list.appendChild(box);
                });
            }

            home();
        </script>
