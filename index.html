const LECTURES=[
 {id:1,title:"الخلية",
  sections:[
  {t:"مقدمة: عالم مكتظ بالنشاط",p:["الخلية عالم مكتظ بالنشاط والتعقيد، والإجابة عن كل المعرفة الحيوية تبدأ منها.","مركز القيادة: النواة.","محطات الطاقة: الميتوكوندريا.","الشبكة الإندوبلازمية وجهاز جولجي.","نظام النقل: الأنابيب الدقيقة.","الجدار الدفاعي: الغشاء البلازمي."]},
  {t:"نظرية الخلية",p:["روبرت هوك (1665): أول من شاهد الخلايا في الفلين الميت وسمّاها «خلية» لأنها بدت كغرف صغيرة.","ليفينهوك (1670): أول من رأى كائنات حية متحركة (بكتيريا) بمجهر بسيط.","شلايدن (نباتات) وشوان (حيوانات) 1830: الخلايا لبنات البناء الأساسية لكل الكائنات.","فيرشو / ريماك (1855): كل خلية تنشأ من خلية موجودة مسبقًا.","المبادئ الثلاثة: وحدة البناء، وحدة الوظيفة، استمرارية الحياة."]},
  {t:"المجاهر",p:["المجهر الضوئي: مصدر الصورة الضوء، يرى الخلايا الحية، دقة متوسطة، تكلفة منخفضة.","المجهر الإلكتروني: مصدر الصورة الإلكترونات، لا يرى الخلايا الحية، دقة عالية جدًا، تكلفة مرتفعة.","الفلوري: يظهر أجزاء معينة من الخلية بدقة عالية.","TEM النافذ: يدرس التركيب الداخلي، صورة ثنائية الأبعاد، عينة رقيقة جدًا.","SEM الماسح: يدرس سطح العينة، صورة ثلاثية الأبعاد.","الإلكترونات طولها الموجي قصير جدًا فتكشف تفاصيل أدق بكثير من الفوتونات.","الفوتون جسيم طاقي بلا كتلة سكونية، والإلكترون جسيم مادي له كتلة سكونية.","شرطا المجهر: قوة التكبير وقوة التمييز."]},
  {t:"أولية النواة وحقيقية النواة",p:["حقيقية النواة: لها نواة وعضيات مفصولة بأغشية، حجمها 10 – 100 ميكرومتر.","أولية النواة: لا نواة ولا أغشية داخلية غالبًا، الـ DNA حر في السيتوبلازم، حجمها 1 – 5 ميكرومتر.","أولية النواة هي البكتيريا، كائنات وحيدة الخلية.","حقيقية النواة تتجاوز أولية النواة في الحجم بفضل سماتها الهيكلية والأيضية."]},
  {t:"الغشاء البلازمي والإكسوسومات",p:["بنية رقيقة تحيط بكل خلية حية، سمكها 4 – 10 نانومتر.","أهميته: حاجز يحافظ على البيئة الداخلية، ينظم مرور المواد (انتشار، نقل نشط، نقل ميسر)، ويرتبط بالهيكل الخلوي.","التركيب: طبقة ثنائية من الفوسفوليبيد (رأس محب للماء للخارج وذيلان كارهان للماء للداخل).","الكوليسترول يمنع التصلب الشديد أو السيولة المفرطة.","بروتينات متكاملة (قنوات ونواقل) وطرفية، وكربوهيدرات على السطح الخارجي.","الإكسوسومات: حويصلات صغيرة خارج الخلية تحمل بروتينات و RNA وتشارك في التواصل بين الخلايا، وتفيد في إصلاح الأنسجة وتجديد البشرة وصحة الشعر."]},
  {t:"السيتوبلازم",p:["مادة هلامية غنية بالماء تُسمى العصارة الخلوية (السيتوسول) فيها بروتينات وسكريات وأيونات.","في حقيقيات النوى: عضيات غشائية والمادة الوراثية داخل النواة.","في بدائيات النوى: لا عضيات غشائية، والمادة الوراثية في النيوكليويد بلا غشاء.","وظائفه: مكان توسع الخلية ونموها، وسط ملائم للعضيات، ويدعمه الهيكل الخلوي."]},
  {t:"النواة والريبوسوم",p:["النواة موطن المادة الوراثية، يحيط بها غشاء نووي من طبقتين (داخلي وخارجي).","المسام النووية تسمح بمرور جزيئات RNA الكبيرة والبروتينات.","بلازما النواة تشبه السيتوبلازم في تركيبها.","النويّة منطقة كثيفة يُصنَّع فيها rRNA.","الـ rRNA يتحد مع بروتينات داخل النوية لتكوين وحدات الريبوسوم، ثم تُنقل عبر المسام إلى السيتوبلازم لتؤدي وظيفتها."]},
  {t:"الشبكة الإندوبلازمية والليسوسوم",p:["الشبكة شبكة واسعة من الأغشية متصلة بالغلاف النووي الخارجي، وتحيط بتجويف منفصل عن السيتوسول.","الخشنة: أكياس مسطحة (صهاريج) مرصعة بالريبوسومات، تصنّع وتنقل البروتينات.","الملساء: أنابيب متفرعة بلا ريبوسومات، تصنّع الدهون وتساعد في إزالة السموم.","الليسوسوم: عضية صغيرة بغشاء، تسمى «مركز إعادة التدوير»، فيها إنزيمات هاضمة.","يفكك النفايات الخلوية والمواد الغريبة والعضيات التالفة (البلعمة الذاتية)."]},
  {t:"البلاستيدات والفجوة العصارية",p:["البلاستيدات الخضراء: عضيات قرصية بغشاء خارجي وداخلي.","بداخلها أقراص الثايلاكويد، تتراص في مجموعات اسمها الجرانا، والسائل المحيط بها الحشوة.","الكلوروفيل صبغة تعطي النبات لونه الأخضر، وهناك أصباغ مساعدة تمتص الضوء وتحمي من الضوء الزائد.","الفجوة العصارية: من أهم عضيات الخلية النباتية، تحفظ بنية النبات بضغطها على الجدار.","تخزن الماء والإنزيمات، وتوجد أيضًا في الخلايا الحيوانية لكنها أصغر."]},
  {t:"الهيكل الخلوي",p:["شبكة من الألياف البروتينية تحافظ على شكل الخلية وتنقل المواد داخليًا.","الخيوط الدقيقة: قطرها 6–7 نانومتر، من الأكتين فقط، وتعمل مع الميوسين في الحركة والانقباض العضلي والانقسام.","الأنابيب الدقيقة: قطرها حوالي 25 نانومتر، من بروتين التوبيولين (α و β)، تشكل مسارات النقل والجهاز المغزلي وحركة الأهداب والأسواط.","الخيوط الوسيطة: قطرها 8–10 نانومتر، مثل الكيراتين، تمنح الخلية المرونة والقوة وتثبت العضيات.","الجسم المركزي: مريكزان متعامدان من تسعة أزواج ثلاثية من الأنابيب، ينظم الأنابيب الدقيقة ويتضاعف قبل الانقسام.","الأسواط تحرك الخلية كاملة، والأهداب تنقل المواد، وكلاهما بنمط 9 + 2."]},
  {t:"جدار الخلية",p:["تركيب صلب مدعم بالسليلوز، يحمي الخلية ويدعمها ويمنحها شكلها.","يوجد في الخلايا النباتية والفطرية وبعض الطلائعيات.","السليلوز عديد سكاريد من وحدات الجلوكوز، يتجمع في ألياف دقيقة.","يحتوي أيضًا على الهيميسليلوز والبكتين.","الصفيحة الوسطى طبقة لاصقة تربط جدران الخلايا المتجاورة.","البلازموديزماتا قنوات ضيقة من السيتوبلازم تعبر الجدران وتسمح بنقل المواد والتواصل بين الخلايا."]},
  {t:"المصفوفة خارج الخلية والوصلات",p:["المصفوفة خارج الخلية في الخلية الحيوانية شبكة من البروتينات والسكريات تدعم الخلايا وتنظم نموها وتمايزها.","الكولاجين: يشكل 25–30% من بروتينات الجسم ويمنح الأنسجة القوة.","البروتيوغليكانات: بروتينات سكرية غنية بالكربوهيدرات.","الإنتجرين مستقبل يربط الخلية بالمصفوفة، والفبرونكتين بروتين لاصق.","الوصلات الفجوية: تسمح بمرور الأيونات والجزيئات الصغيرة (كما في القلب).","الوصلة المعلقة (الديسموسوم): تعمل كالمسامير في الأنسجة المعرضة للشد.","الوصلات المحكمة: ختم يمنع تسرب السوائل بين الخلايا (مثانة)."]},
  {t:"حركة الخلية وحجمها والمقارنات",p:["الأقدام الكاذبة: نتوءات للحركة والتقاط الطعام، كما في الأميبا.","الأهداب: زوائد تشبه الشعر كما في البرامسيوم.","الأسواط: زوائد طويلة تشبه الذيل للحركة السريعة بضرب الماء.","الخلية أصغر وحدة حية تؤدي جميع الوظائف.","الإكسوسوم: حويصلة تحمل جزيئات للتواصل.","السنتروسوم: ينظم الأنابيب الدقيقة ومغزل الانقسام.","الميزوسوم: يُعتقد حديثًا أنه أثر لتحضير العينة وليس عضية ثابتة.","البيروكسيسوم: بغشاء واحد، يكسر الأحماض الدهنية ويتعامل مع فوق أكسيد الهيدروجين بالكاتالاز."]}
  ],

   {q:"من أول من شاهد الخلايا في الفلين الميت؟",o:["ليفينهوك","روبرت هوك","شوان"],a:1},

   {q:"ماذا أدرك شلايدن وشوان عام 1830؟",o:["الخلايا لبنات البناء الأساسية للكائنات","الخلايا تنشأ من العدم","النواة هي الخلية"],a:0},
   {q:"أي مجهر يمكنه رؤية الخلايا الحية؟",o:["الإلكتروني النافذ","الإلكتروني الماسح","الضوئي"],a:2},
   {q:"أي مجهر يعطي صورة ثلاثية الأبعاد لسطح العينة؟",o:["SEM","TEM","الضوئي"],a:0},

   {q:"كم حجم الخلية أولية النواة تقريبًا؟",o:["10 – 100 ميكرومتر","1 – 5 ميكرومتر","1 – 5 ملم"],a:1},
   {q:"كم سمك الغشاء البلازمي؟",o:["4 – 10 نانومتر","4 – 10 ميكرومتر","4 – 10 ملم"],a:0},
   {q:"ما دور الكوليسترول في الغشاء؟",o:["تصنيع البروتين","يمنع التصلب الشديد أو السيولة المفرطة","هضم النفايات"],a:1},
   {q:"أين يتم تصنيع rRNA؟",o:["النويّة","الليسوسوم","جهاز جولجي"],a:0},
   {q:"ما وظيفة الشبكة الإندوبلازمية الخشنة؟",o:["تصنيع الدهون","تصنيع ونقل البروتينات","إزالة السموم"],a:1},
   {q:"ما وظيفة الليسوسوم؟",o:["البناء الضوئي","هضم النفايات والمواد الغريبة","تخزين الماء فقط"],a:1},
   {q:"مم تتكون الخيوط الدقيقة (Microfilaments)؟",o:["التوبيولين","الكيراتين","الأكتين"],a:2},
   {q:"ما المكوّن الرئيسي لجدار الخلية النباتية؟",o:["الكولاجين","السليلوز","الكيراتين"],a:1}

 {id:2,title:"الخلية الميكروبية",
  sections:[
  {t:"النواة: التعريف والتركيب",p:["العضية الرئيسية ومركز الخلية، تتحكم في كل الأنشطة الخلوية وتخزن المادة الوراثية DNA.","توجد في خلايا الكائنات الحية ما عدا البكتيريا والطحالب الزرقاء المخضرة.","أكبر أجزاء الخلية، وتمثل حوالي 10% من حجمها.","الغشاء النووي: غشاء مزدوج به مسام نووية تسمح بمرور RNA والبروتينات بين النواة والسيتوبلازم.","السيتوبلازم النووي: سائل هلامي فيه أملاح وإنزيمات.","الكروماتين: DNA مع بروتينات الهيستون، خيوط في المرحلة غير الانقسامية وتتكثف لتكوّن الكروموسومات أثناء الانقسام.","النوية: منطقة بلا غشاء، موقع تصنيع rRNA وتجميع الوحدات الريبوسومية."]},
  {t:"وظيفة النواة",p:["تخزين المعلومات الوراثية DNA.","التحكم في نمو الخلية وانقسامها.","توجيه تصنيع البروتينات عن طريق RNA.","تنظيم عمليات التمثيل الغذائي داخل الخلية.","تكوين النوية التي تنتج الريبوسومات.","مكوناتها الأخرى: إنزيمات لتكرار DNA ومكونات تنظيمية للتحكم في التعبير الجيني."]},
  {t:"أوليات النواة وحقيقيات النواة",p:["أوليات النواة (البكتيريا والطحالب الزرقاء): لا نواة محاطة بغشاء، المادة الوراثية في منطقة تسمى النيوكليويد.","حجمها صغير (1–10 ميكرومتر)، بلا عضيات غشائية، كروموسوم دائري واحد، وتنقسم انقسامًا ثنائيًا بسيطًا.","حقيقيات النواة (حيوانية، نباتية، فطرية): نواة محاطة بغشاء نووي مزدوج.","حجمها أكبر (10–100 ميكرومتر)، فيها عضيات غشائية كالميتوكوندريا والشبكة الإندوبلازمية وجولجي.","كروموسوماتها خيطية متصلة بالهيستونات، وتنقسم ميتوزيًا وميوزيًا."]},
  {t:"الريبوسومات",p:["عضية دقيقة في جميع الخلايا الحية، وظيفتها الأساسية تصنيع البروتينات بترجمة mRNA.","تتكون من rRNA وبروتينات، وتعد «المصانع الخلوية» للبروتين.","حرة في السيتوبلازم: تبني بروتينات تُستخدم داخل السيتوبلازم.","مرتبطة بالشبكة الإندوبلازمية الخشنة والغشاء الخارجي للنواة: تبني بروتينات تُستخدم خارج الخلية.","أوليات النواة: ريبوسوم 70S من وحدتين 50S و 30S، ووزنه حوالي 2.7 مليون دالتون، وفي E. coli حوالي 15 ألف ريبوسوم.","حقيقيات النواة: ريبوسوم 80S من وحدتين 60S و 40S، ووزنه حوالي 4.3 مليون دالتون، وخلية الكبد فيها حوالي 10 ملايين ريبوسوم."]},
  {t:"إنتاج البروتين",p:["في أوليات النواة (البكتيريا): النسخ والترجمة داخل السيتوبلازم مباشرة.","لا يوجد فصل بينهما، فقد تبدأ الترجمة بينما mRNA ما زال يُنسخ.","لا توجد معالجة أولية لـ mRNA، وتحدث الترجمة على ريبوسومات حرة.","في حقيقيات النواة: يبدأ النسخ في النواة فيتكون Pre-mRNA ثم يُعالج فيصبح mRNA ناضجًا.","يخرج mRNA و tRNA من النواة إلى السيتوبلازم عبر المسام النووية.","الترجمة: تحويل mRNA إلى سلسلة أحماض أمينية بمساعدة tRNA والريبوسوم."]},
  {t:"الشبكة الإندوبلازمية",p:["عضية غشائية من أنابيب وأكياس، غشاؤها متصل بالغلاف النووي.","الخشنة: عليها ريبوسومات فتبدو خشنة، وتسهم في تصنيع البروتينات.","الملساء: بلا ريبوسومات، فيها إنزيمات تصنع الدهون وتزيل سمية بعض المركبات.","تخليق الدهون: الفوسفوليبيد والكوليسترول.","بالتعاون مع الميتوكوندريا تخلّق الهرمونات الاسترويدية من الكوليسترول.","الكبد غني بالشبكة الملساء لإزالة السموم."]},
  {t:"جهاز جولجي",p:["عضية في حقيقيات النواة، مركز معالجة وتعديل وتغليف البروتينات والليبيدات القادمة من الشبكة الإندوبلازمية.","سُمي نسبة إلى مكتشفه كاميلو جولجي.","عدده من جهاز واحد إلى مئات في الخلية الواحدة.","يتكون من أكياس مسطحة مكدسة تسمى الصهاريج.","الوجه cis: يستقبل البروتينات من الشبكة الإندوبلازمية.","الوجه trans: يرسل البروتينات المعدلة إلى وجهتها.","وظيفته: تعديل البروتينات (إضافة سكريات)، وفرزها وتعبئتها في حويصلات توجّه إلى الغشاء الخلوي أو الليسوسومات."]},
  {t:"الميتوكوندريا وإنتاج الطاقة",p:["عضية محاطة بغشائين في معظم حقيقيات النواة، مسؤولة عن إنتاج الطاقة على هيئة ATP.","تكوين NADH و FADH2 من مراحل التنفس الخلوي.","سلسلة نقل الإلكترونات في الغشاء الداخلي تضخ البروتونات إلى الحيز بين الغشائين.","يتكون تدرج بروتوني، وتعود البروتونات عبر إنزيم ATP synthase فيتكون ATP من ADP والفوسفات.","الأكسجين المستقبل النهائي للإلكترونات ويتكون الماء.","دورة كربس تحدث في الحشوة.","لا توجد في كريات الدم الحمراء الناضجة، وتعتمد على التحلل السكري."]},
  {t:"الغشاء الخارجي والحيز بين الغشائين",p:["الغشاء الخارجي: طبقة مزدوجة من الفوسفوليبيد مع بروتينات بنسبة تقارب الدهون.","بروتينات البورين (VDAC) قنوات تسمح بمرور الجزيئات الصغيرة، فهو شبه منفذ.","معقد TOM ينقل البروتينات الكبيرة من السيتوبلازم إلى الداخل.","وظائفه: الحماية، تنظيم النفاذية، نقل البروتينات، والمشاركة في الموت المبرمج.","الحيز بين الغشائين فيه Adenylate kinase و Cytochrome c وأيونات مثل H+ و Ca2+.","وظيفته: توليد التدرج البروتوني وتخزين الأيونات.","الموت المبرمج: موت خلوي منظم، تُطلق فيه الميتوكوندريا Cytochrome c فتنشط إنزيمات الكاسبيز، ثم تتكون أجسام استماتية وتبتلعها الخلايا البلعمية."]},
  {t:"الغشاء الداخلي والأعراف والحشوة",p:["الغشاء الداخلي رقيق، يحتوي الكارديوليبين الذي يمنحه القوة والثبات، وهو دهن فسفوري بأربع سلاسل دهنية.","شبه غير منفذ، ولا تمر المواد إلا عبر بروتينات ناقلة، وغني بالبروتينات.","وظائفه: تكوين التدرج البروتوني، وإنتاج ATP، ونقل البروتينات عبر TIM، وتنظيم الأيونات.","الأعراف (Cristae): طيات تزيد مساحة السطح فتزيد مواقع إنتاج الطاقة، وتكثر في القلب والكبد.","عدد الأعراف وحده لا يحدد الكفاءة، فهي تعتمد أيضًا على سلامة الأغشية والأكسجين والإنزيمات.","الحشوة: فيها mtDNA وريبوسومات ميتوكوندرية وإنزيمات دورة كربس وأكسدة الأحماض الدهنية."]},
  {t:"استيراد البروتينات إلى الميتوكوندريا",p:["معظم بروتينات الميتوكوندريا تُصنع على ريبوسومات السيتوبلازم ثم تُوجَّه إليها بإشارات توجيه.","TOM: البوابة الرئيسية في الغشاء الخارجي، فيه مستقبلات TOM20 و TOM22 و TOM70، والقناة TOM40.","TIM23: يوجه البروتينات ذات إشارة presequence إلى الحشوة، بمساعدة محرك PAM و mtHsp70 و ATP، وتُزال الإشارة بإنزيم MPP.","TIM22: يدمج البروتينات الناقلة متعددة العبور في الغشاء الداخلي، بمساعدة Small TIMs.","SAM: يجمع ويدمج بروتينات β-barrel في الغشاء الخارجي."]},
  {t:"المصفوفة خارج الخلية ECM",p:["شبكة ديناميكية من البروتينات والجزيئات السكرية خارج الخلايا في الأنسجة الحيوانية، تفرزها الخلايا.","الكولاجين: الأكثر وفرة (25% من بروتين الجسم) ويدعم العظام والغضاريف والأربطة.","الإيلاستين: يمنح المرونة (الأوعية الدموية والجلد).","الفيبرونيكتين: يساعد الخلايا على الالتصاق ويهم في التئام الجروح.","الجليكوزامينوجليكان: سكريات طويلة تمنح اللزوجة وتحتفظ بالماء.","الإنتجرينات: مستقبلات تعبر الغشاء وترتبط بالفيبرونيكتين والكولاجين من الخارج وبخيوط الأكتين من الداخل.","وظائف ECM: دعم ميكانيكي، تنظيم الإشارات، توجيه هجرة الخلايا، التجديد والشفاء، الحفاظ على التوازن، وتخزين عوامل النمو."]},
  {t:"مقارنة: البكتيريا والفطريات والفيروسات",p:["البكتيريا: أوليات النواة، وحيدة الخلية، مادتها DNA حرة في السيتوبلازم، تعيش في كل مكان، بعضها ذاتي التغذية، وتتكاثر بالانقسام الثنائي.","الفطريات: حقيقيات النواة بنواة وغشاء نووي، وحيدة الخلية (الخميرة) أو عديدة الخلايا (العفن)، غير ذاتية التغذية، وتتكاثر جنسيًا أو لاجنسيًا.","الفيروسات: ليست خلايا حية، غلاف بروتيني يحيط بمادة وراثية DNA أو RNA، طفيلية إجبارية داخل الخلايا الحية.","الفيروس لا يتكاثر إلا داخل خلية مضيفة بالنسخ الذاتي لمادته الوراثية."]}
  ],
  questions:[
   {q:"كم تمثل النواة تقريبًا من حجم الخلية؟",o:["10%","50%","1%"],a:0},
   {q:"ما وظيفة النوية؟",o:["تخزين الدهون","تصنيع rRNA وتجميع الوحدات الريبوسومية","إنتاج ATP"],a:1},
   {q:"ماذا يسمى DNA مع الهيستونات في خيوط خلال المرحلة غير الانقسامية؟",o:["النوية","الكروماتين","الحشوة"],a:1},
   {q:"ما اسم المنطقة غير المحاطة بغشاء التي تحوي الجينوم في البكتيريا؟",o:["النيوكليويد","النواة","النوية"],a:0},
   {q:"كم حجم الخلية حقيقية النواة تقريبًا؟",o:["1 – 10 ميكرومتر","10 – 100 ميكرومتر","100 – 1000 ميكرومتر"],a:1},
   {q:"ما نوع الريبوسوم في أوليات النواة؟",o:["80S","70S","30S فقط"],a:1},
   {q:"الريبوسومات الحرة في السيتوبلازم تبني بروتينات تُستخدم أين؟",o:["خارج الخلية","داخل السيتوبلازم","داخل الليسوسوم فقط"],a:1},
   {q:"ما الذي يميز إنتاج البروتين في البكتيريا؟",o:["النسخ والترجمة متزامنان","النسخ في النواة","وجود معالجة أولية لـ mRNA"],a:0},
   {q:"أين يبدأ النسخ في حقيقيات النواة؟",o:["السيتوبلازم","النواة","الريبوسوم"],a:1},
   {q:"ما وظيفة الشبكة الإندوبلازمية الملساء؟",o:["تصنيع البروتين","تخليق الدهون وإزالة السموم","هضم النفايات"],a:1},
   {q:"أي وجه في جهاز جولجي يستقبل البروتينات من الشبكة الإندوبلازمية؟",o:["trans","cis","الصهريج"],a:1},
   {q:"ما الجزيء الذي تنتجه الميتوكوندريا كمصدر للطاقة؟",o:["ATP","الكولاجين","rRNA"],a:0},
   {q:"ما المستقبل النهائي للإلكترونات في سلسلة نقل الإلكترونات؟",o:["الأكسجين","الجلوكوز","النيتروجين"],a:0},
   {q:"أي غشاء في الميتوكوندريا يحتوي الكارديوليبين والأعراف؟",o:["الخارجي","الداخلي","الغلاف النووي"],a:1},
   {q:"أي بروتين تطلقه الميتوكوندريا في الموت المبرمج؟",o:["Cytochrome c","الفيبرونيكتين","الهيستون"],a:0}
  ]},
 {id:3,title:"المحاضرة الثالثة"}
];
const app=document.getElementById('app');
const root=document.documentElement;
document.getElementById('theme').onclick=()=>{
  const dark=getComputedStyle(root).colorScheme==='dark';
  root.setAttribute('data-theme',dark?'light':'dark');
};
function home(){
  app.innerHTML='<h2>اختار المحاضرة</h2>';
  LECTURES.forEach(l=>{
    const b=document.createElement('button');
    b.className='card';b.disabled=!l.sections;
    b.innerHTML=`<span class="num">${l.id}</span><span><div class="t">${l.title}</div><div class="m">${l.sections?`${l.sections.length} قسم · ${l.questions.length} سؤال`:'قريبًا'}</div></span>`;
    if(l.sections)b.onclick=()=>lecture(l,'sec');
    app.appendChild(b);
  });
}
function lecture(l,tab){
  app.innerHTML=`<button class="back">← رجوع</button><h2>${l.title}</h2>
  <div class="tabs"><button class="tab ${tab==='sec'?'on':''}" data-t="sec">الأقسام</button><button class="tab ${tab==='quiz'?'on':''}" data-t="quiz">الأسئلة</button></div><div id="body"></div>`;
  app.querySelector('.back').onclick=home;
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>lecture(l,t.dataset.t));
  const body=document.getElementById('body');
  if(tab==='sec'){
    l.sections.forEach((s,i)=>{const d=document.createElement('details');d.className='sec';d.innerHTML=`<summary>${i+1}. ${s.t}</summary><ul>${s.p.map(x=>`<li>${x}</li>`).join('')}</ul>`;if(i===0)d.open=true;body.appendChild(d)});
  }else quiz(l,body);
}
function quiz(l,body){
  let score=0,answered=0;
  const sc=document.createElement('div');sc.className='score';sc.textContent=`النتيجة: 0 / ${l.questions.length}`;
  body.appendChild(sc);
  l.questions.forEach(q=>{
    const box=document.createElement('div');box.className='sec';
    box.innerHTML=`<div class="t" style="font-size:1rem">${q.q}</div>`;
    q.o.forEach((txt,i)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=txt;
      b.onclick=()=>{
        if(box.dataset.done)return;box.dataset.done=1;answered++;
        const btns=box.querySelectorAll('.opt');
        btns[q.a].classList.add('ok');
        if(i===q.a)score++;else b.classList.add('bad');
        sc.textContent=`النتيجة: ${score} / ${l.questions.length}`;
      };
      box.appendChild(b);
    });
    body.appendChild(box);
  });
}
home();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
