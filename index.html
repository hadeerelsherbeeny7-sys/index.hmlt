<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خلية بكتيريه</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f0fdfa;color:#134e4a;line-height:1.7}
    header{background:#0f766e;color:#fff;padding:24px 16px;text-align:center}
    main{max-width:640px;margin:0 auto;padding:20px 16px}
    .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
    a.btn,button{display:inline-block;background:#0f766e;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:16px;text-decoration:none;cursor:pointer}
    #install{display:none}
  </style>
</head>
<body>
  <header><h1>خلية بكتيريه</h1><p>المحاضرات</p></header>
  <main>
    <div class="card">
      <h2>محاضرة 1</h2>
      <p>اضغط لفتح ملف المحاضرة.</p>
      <a class="btn" href="lecture1.pdf">فتح المحاضرة (PDF)</a>
    </div>
    <div class="card">
      <button id="install">تثبيت التطبيق</button>
    </div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
    let deferred;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); deferred = e;
      document.getElementById('install').style.display = 'inline-block';
    });
    document.getElementById('install').addEventListener('click', async () => {
      if (!deferred) return;
      deferred.prompt(); await deferred.userChoice; deferred = null;
      document.getElementById('install').style.display = 'none';
    });
  </script>
</body>
</html>
